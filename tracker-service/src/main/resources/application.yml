server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: tracker-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${DATABASE_USER:jobradar}
    password: ${DATABASE_PASSWORD:jobradar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        default-requeue-rejected: false   # after retries are exhausted -> dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2

jobradar:
  jwt:
    # HS256 key shared with scraper-service; must be >= 32 bytes. Override in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl: ${JWT_TTL:PT12H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/docs/openapi.json
