name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ unit + integration tests
  scraper-service:
    name: scraper-service (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scraper-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  tracker-service:
    name: tracker-service (Java)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tracker-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Includes Testcontainers tests against real PostgreSQL + RabbitMQ (Docker is available on runners).
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-coverage
          path: tracker-service/target/site/jacoco/

  frontend:
    name: frontend (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ------------------------------------------------------------------ full-stack end-to-end
  e2e:
    name: end-to-end (docker compose)
    needs: [scraper-service, tracker-service, frontend]
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ delivery
  publish:
    name: publish images (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [scraper-service, tracker-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jobradar-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy (staging)
    # Opt-in: set repository variable DEPLOY_HOST and secrets DEPLOY_SSH_KEY / DEPLOY_USER.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Roll out the new images over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" "mkdir -p ~/jobradar"
          scp -i key docker-compose.yml "$USER@$HOST:~/jobradar/docker-compose.yml"
          ssh -i key "$USER@$HOST" "cd ~/jobradar && \
            REGISTRY=$REGISTRY TAG=$GITHUB_SHA docker compose pull && \
            REGISTRY=$REGISTRY TAG=$GITHUB_SHA docker compose up -d --no-build --wait"
