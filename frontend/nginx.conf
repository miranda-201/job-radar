# API gateway + static file server.
#   /api/scraper/*  -> scraper-service (FastAPI)
#   /api/*          -> tracker-service (Spring Boot)
#   everything else -> React SPA
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker's embedded DNS; resolve per request so a restarted container's new IP is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $scraper http://scraper-service:8000;
    set $tracker http://tracker-service:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/scraper/ {
        proxy_pass $scraper;
        proxy_read_timeout 120s;   # a full manual sweep can take a while
    }

    location /api/ {
        proxy_pass $tracker;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
